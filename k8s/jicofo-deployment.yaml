apiVersion: apps/v1
kind: Deployment
metadata:
  name: jicofo
  namespace: jitsi-meet
  labels:
    app: jicofo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jicofo
  template:
    metadata:
      labels:
        app: jicofo
    spec:
      containers:
      - name: jicofo
        image: jitsi/jicofo:stable-8922
        env:
        - name: JICOFO_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jitsi-secrets
              key: JICOFO_AUTH_PASSWORD
        - name: JICOFO_COMPONENT_SECRET
          valueFrom:
            secretKeyRef:
              name: jitsi-secrets
              key: JICOFO_COMPONENT_SECRET
        - name: JICOFO_BRIDGE_MUC
          valueFrom:
            configMapKeyRef:
              name: jitsi-config
              key: JICOFO_BRIDGE_MUC
        - name: JICOFO_BRIDGE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: jitsi-config
              key: JICOFO_BRIDGE_PASSWORD
        - name: PROSODY_SERVER
          value: "prosody-service"
        - name: JICOFO_XMPP_SERVER
          value: "prosody-service"
        - name: XMPP_SERVER
          value: "prosody-service"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep java"
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep java"
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jicofo-service
  namespace: jitsi-meet
  labels:
    app: jicofo
spec:
  selector:
    app: jicofo
  ports:
  - port: 5347
    targetPort: 5347
  type: ClusterIP
