apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jitsi-ingress
  namespace: jitsi-meet
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "jitsi-web-service"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - meet.localhost
    secretName: jitsi-localhost-tls
  rules:
  - host: meet.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jitsi-web-service
            port:
              number: 80
---
# Alternative: Simple LoadBalancer services for local development
apiVersion: v1
kind: Service
metadata:
  name: jitsi-api-external
  namespace: jitsi-meet
spec:
  selector:
    app: jitsi-api
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: jitsi-web-external
  namespace: jitsi-meet
spec:
  selector:
    app: jitsi-web
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
  type: LoadBalancer
