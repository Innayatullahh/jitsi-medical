services:
  # Add our API service
  jitsiappointmentapi:
    build:
      context: ../
      dockerfile: JitsiAppointmentApi/Dockerfile
    ports:
      - "5000:80"
    networks:
      meet.jitsi:
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://ai-medical-api.invomail.io/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Add our database service
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jitsi_appointments
      POSTGRES_USER: jitsi_appointments_user
      POSTGRES_PASSWORD: Oxs1fHv9nwXTcR
    ports:
      - "5432:5432"
    networks:
      meet.jitsi:
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Override web service to use our custom port
  web:
    ports:
      - "8000:80"
      - "8443:443"

volumes:
  postgres_data:
