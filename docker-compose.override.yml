services:
  jitsiappointmentapi:
    image: jitsiappointmentapi:latest
    ports:
      - "5000:80"
    networks:
      - meetnet
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jitsi_appointments
      POSTGRES_USER: jitsi_appointments_user
      POSTGRES_PASSWORD: Oxs1fHv9nwXTcR
    ports:
      - "5432:5432"
    volumes:
      - /mnt/db_data:/var/lib/postgresql/data
    networks:
      - meetnet

networks:
  meetnet:
    driver: bridge