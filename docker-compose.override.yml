version: '3.8'

services:
  jitsiappointmentapi:
    image: jitsiappointmentapi:latest
    ports:
      - "5000:80"
    networks:
      - meetnet
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jitsi_appointments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    networks:
      - meetnet

networks:
  meetnet:
    driver: bridge
